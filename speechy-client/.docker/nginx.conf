server {
    # 8080, not 80: OpenShift's restricted SCC runs the container as a
    # non-root, arbitrary UID, which can't bind privileged ports.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — all unmatched paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for Vite-hashed assets
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No caching for the HTML entry point itself
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
}
