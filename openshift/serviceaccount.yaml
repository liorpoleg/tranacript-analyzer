# Shared by postgres and redis. Neither stock image (postgres:16-alpine,
# redis:7-alpine — the same ones DEPLOYMENT.md §2.1 has you pre-pull for the
# air gap) supports OpenShift's arbitrary-UID "restricted" SCC: postgres's
# entrypoint expects to chown its data dir as root on first boot, and
# redis's image ships /data owned by uid 999. After creating the namespace,
# grant this ServiceAccount `anyuid` once:
#
#   oc adm policy add-scc-to-user anyuid -z speechy-infra -n speechy
#
# That's a broad grant (root-equivalent for this SA) scoped to two
# self-contained, non-internet-facing pods — acceptable for an internal
# datastore, but swap in an arbitrary-UID-friendly image (e.g. Red Hat's
# rhel8/postgresql-16, or Bitnami's images) instead if your cluster policy
# forbids anyuid. speechy-server and speechy-client need no such exception —
# both were adapted to run under the default restricted SCC (see their
# .docker/Dockerfile comments).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: speechy-infra
  labels:
    app: speechy
