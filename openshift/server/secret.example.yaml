# Copy to secret.yaml, fill in real values, then apply it directly —
# it is NOT part of kustomization.yaml's resources and CI never touches it,
# same as .env vs .env.example. Add openshift/**/secret.yaml to your local
# gitignore awareness: it's already covered by the repo-root .gitignore.
#
#   cp openshift/server/secret.example.yaml openshift/server/secret.yaml
#   # edit the values below
#   oc apply -f openshift/server/secret.yaml -n speechy
apiVersion: v1
kind: Secret
metadata:
  name: speechy-server-secret
  labels:
    app: speechy
    component: server
type: Opaque
stringData:
  SECRET_KEY: change-me-to-a-long-random-string
  DB_PASSWORD: change-me
  # EXTERNAL_URL: LLM API endpoint — must be set; no default
  LLM_ENDPOINT: ""
  LLM_API_KEY: ""
