apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: speechy
resources:
  - configmap.yaml
  - pvc-media.yaml
  - deployment-web.yaml
  - deployment-worker.yaml
  - service.yaml
  - route.yaml
# secret.yaml is deliberately NOT listed here — apply it once, by hand,
# after copying it from secret.example.yaml. See that file's header.

# Generates a ConfigMap named exactly "speechy-prompts" (no hash suffix)
# straight from the repo's prompts/ directory — one key per file, mounted
# read-only at /prompts in both deployments. Because the name is fixed,
# `oc apply -k` on a prompt-only change updates the ConfigMap in place and
# kubelet syncs the mounted volume to every pod within ~60-90s — no
# redeploy, matching CLAUDE.md §6's "editable without restart" requirement.
configMapGenerator:
  - name: speechy-prompts
    files:
      - ../../prompts/translate.md
      - ../../prompts/episode_summary.md
      - ../../prompts/contextual_summary.md
      - ../../prompts/chat.md
generatorOptions:
  disableNameSuffixHash: true
